[project]
name = "pebbleopengym"
version = "0.1.0"
description = "Development tools for openGym on Pebble Time 2 (exercise names, mock API)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Johann Grobe", email = "j.grobe@namowo.de" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pebbleopengym = "pebbleopengym:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
